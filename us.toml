# Config file for Mario Kart 64 NTSC Recompilation.
[input]
entrypoint = 0x80000400
# Paths are relative to the location of this config file.
# elf_path = "mk64.us.elf"
symbols_file_path = "MarioKart64RecompSyms/mk64.us.syms.toml"
rom_file_path = "mk64.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true
# trace_mode = true
[patches]
stubs = [
]

ignored = [
    "__osBlockSum",
    "__osPfsReleasePages",
    "__osPfsDeclearPage",
]

# fixes a bug with the recompiler handling an Indirect tail call.
[[patches.instruction]]
func = "func_80040C54"
vram = 0x80040C8C
value = 0x03E00008 # jr $s3 -> jr $ra

# Generate pipe collision mesh for high poly count model
# regardless of game mode:
# if (gScreenModeSelection == SCREEN_MODE_1P) {
#     generate_collision_mesh_with_defaults((Gfx*) 0x070008E8);
# } else {
#     // @recomp
#     // generate_collision_mesh_with_defaults((Gfx*) 0x07002D68);
#     generate_collision_mesh_with_defaults((Gfx*) 0x070008E8);
# }
[[patches.instruction]]
func = "course_generate_collision_mesh"
vram = 0x80295E70
value = 0x348408E8 # $a0, $a0, 0x2D68 -> $a0, $a0, 0x8E8
